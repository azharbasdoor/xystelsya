
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0F1A">
<title>Xystelsya AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PALETTE (kept as plain hex, not CSS variables — older Tizen
     WebKit builds on feature phones don't reliably support
     custom properties, so this trades a bit of DRY-ness for
     guaranteed rendering on the oldest target devices)

     bg deep      #0B0F1A
     panel        #121826
     panel border #212B42
     accent amber #E9A23B  (signature colour — "secure channel")
     accent teal  #35D0C0
     text primary #EDEFF6
     text muted   #8892AA
     bubble user  gradient #275a52 → #1B4640 / text #E9FBF3
     bubble agent gradient #1C264A → #151C34 / thin amber border
     danger       #E15A4C

     type: "IBM Plex Mono" for brand/labels, "IBM Plex Sans" for
     body copy — both fall back to the system stack if the font
     fails to load (offline / old device), so nothing breaks.
  ============================================================ */

  * { box-sizing: border-box; -webkit-box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #0B0F1A;
    background-image: radial-gradient(circle at 50% 0%, #101528 0%, #0B0F1A 60%);
    color: #EDEFF6;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* App shell: fills the viewport, header/controls fixed in place,
     the message thread is the only part that scrolls. On wider
     screens it becomes a centered, framed "device" card instead
     of stretching edge to edge. */
  .app-shell {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background-color: #0B0F1A;
  }

  @media (min-width: 560px) {
    html, body { background-color: #05070D; }
    .app-shell {
      min-height: 92vh;
      margin: 4vh auto;
      border: 1px solid #212B42;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }
  }

  /* ---------- header ---------- */
  .header {
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    padding: 14px 16px;
    background-color: #121826;
    border-bottom: 1px solid #212B42;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    line-height: 36px;
    text-align: center;
    border-radius: 9px;
    background-color: #E9A23B;
    color: #1B1206;
    font-weight: bold;
    font-size: 16px;
    margin-right: 12px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 2px;
    font-weight: 700;
  }

  .brand-text p {
    margin: 2px 0 0 0;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8892AA;
  }

  /* ---------- status / loading indicator ---------- */
  /* Same #status-text hook the existing script toggles between
     none/block — only the visual treatment changed. */
  .status-text {
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    display: none;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #E9A23B;
    text-align: center;
    padding: 8px 10px;
    background-color: #171006;
    border-bottom: 1px dashed #E9A23B;
  }

  .status-text:before {
    content: "\25CF ";
    animation: blink 1.1s steps(1) infinite;
    -webkit-animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0.25; } }
  @-webkit-keyframes blink { 50% { opacity: 0.25; } }

  @media (prefers-reduced-motion: reduce) {
    .status-text:before { animation: none; -webkit-animation: none; }
  }

  /* ---------- message thread ---------- */
  .chat-container {
    -webkit-flex: 1;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px;
    background-color: #090D17;
    background-image:
      radial-gradient(rgba(233,162,59,0.10) 1px, transparent 1.4px),
      radial-gradient(rgba(53,208,192,0.05) 1px, transparent 1.4px);
    background-size: 24px 24px, 24px 24px;
    background-position: 0 0, 12px 12px;
  }

  .message {
    max-width: 82%;
    margin-bottom: 14px;
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 15px;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.28);
  }

  .user-message {
    background-image: linear-gradient(155deg, #275a52 0%, #1B4640 100%);
    color: #E9FBF3;
    margin-left: auto;
    border-bottom-right-radius: 5px;
  }

  .assistant-message {
    background-image: linear-gradient(155deg, #1C264A 0%, #151C34 100%);
    color: #E7E9F5;
    margin-right: auto;
    border: 1px solid rgba(233,162,59,0.28);
    border-bottom-left-radius: 5px;
  }

  /* ---------- controls ---------- */
  .controls {
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    padding: 12px 14px 10px 14px;
    background-color: #121826;
    border-top: 1px solid #212B42;
  }

  .send-form {
    display: -webkit-flex;
    display: flex;
  }

  input[type="text"] {
    -webkit-appearance: none;
    appearance: none;
    -webkit-flex: 1;
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    font-size: 16px;
    border: 1px solid #212B42;
    border-radius: 10px 0 0 10px;
    background-color: #0B0F1A;
    color: #EDEFF6;
  }

  input[type="text"]::-webkit-input-placeholder { color: #5A6480; }
  input[type="text"]::placeholder { color: #5A6480; }

  input[type="text"]:focus {
    outline: none;
    border-color: #E9A23B;
    box-shadow: 0 0 0 2px rgba(233,162,59,0.35);
  }

  .send-form input[type="submit"] {
    -webkit-appearance: none;
    appearance: none;
    border: none;
    border-radius: 0 10px 10px 0;
    padding: 0 18px;
    font-size: 14px;
    font-weight: bold;
    background-color: #E9A23B;
    color: #1B1206;
    cursor: pointer;
  }

  .send-form input[type="submit"]:active { background-color: #D18F2F; }

  .secondary-actions {
    display: -webkit-flex;
    display: flex;
    margin-top: 8px;
  }

  .secondary-form { -webkit-flex: 1; flex: 1; }
  .secondary-form + .secondary-form { margin-left: 8px; }

  .secondary-actions input[type="submit"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    padding: 9px 6px;
    font-size: 12.5px;
    font-weight: bold;
    letter-spacing: 0.3px;
    border-radius: 8px;
    cursor: pointer;
    background-color: transparent;
  }

  .btn-refresh {
    border: 1px solid #2C6E68;
    color: #35D0C0;
  }
  .btn-refresh:active { background-color: #10221F; }

  .btn-clear {
    border: 1px solid #6E3530;
    color: #E15A4C;
  }
  .btn-clear:active { background-color: #221211; }

  input[type="submit"]:focus,
  input[type="text"]:focus {
    outline: 2px solid #E9A23B;
    outline-offset: 1px;
  }

  /* ---------- footer ---------- */
  .footer {
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: #5A6480;
    padding: 10px;
    background-color: #121826;
  }
</style>
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="brand-mark mono" aria-hidden="true">X</div>
      <div class="brand-text">
        <h1 class="mono">XYSTELSYA</h1>
        <p>Tasyacore Intelligence System</p>
      </div>
    </header>

    <div id="status-text" class="status-text mono">Memuat...</div>

    <main id="chat-messages" class="chat-container">
      <div class="message assistant-message" id="first-msg">This is Xystelsya, 007 Agent, Ready to listen your secret.</div>
    </main>

    <div class="controls">
      <form onsubmit="return eksekusiKirim();" action="javascript:void(0);" class="send-form">
        <label for="user-input" class="sr-only">Ketik pesan</label>
        <input type="text" id="user-input" placeholder="Ketik pertanyaan..." autocomplete="off">
        <input type="submit" value="Kirim" aria-label="Kirim pesan">
      </form>

      <div class="secondary-actions">
        <form action="?" method="GET" class="secondary-form">
          <input type="submit" value="Cek Balasan" class="btn-refresh" aria-label="Cek balasan dan refresh chat">
        </form>
        <form onsubmit="return eksekusiHapus();" action="javascript:void(0);" class="secondary-form">
          <input type="submit" value="Hapus Obrolan" class="btn-clear" aria-label="Hapus semua obrolan">
        </form>
      </div>
    </div>

    <footer class="footer">nS.aB Private Family Media</footer>

  </div>

  <script src="chat.js"></script>
</body>
</html>
