<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xystelsya AI</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #3016db;
    color: #ffffff;
    margin: 0;
    padding: 0;
    line-height: 1.4;
  }
  .header {
    background-color: #ffffff;
    color: #0f1c73;
    text-align: center;
    padding: 10px;
    border-bottom: 2px solid #2712e0;
  }
  .header h1 { margin: 0 0 5px 0; font-size: 18px; }
  .header p { margin: 0; font-size: 11px; color: #6b7280; }
  
  .chat-container { padding: 10px; }
  
  .message {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    color: #000000;
    word-wrap: break-word;
  }
  
  .user-message { background-color: #e0129c; color: #ffffff; margin-left: 15%; text-align: right; }
  .assistant-message { background-color: #10d2e8; color: #000000; margin-right: 15%; }
  
  .status-text {
    font-size: 13px;
    font-weight: bold;
    color: #ffff00;
    text-align: center;
    padding: 10px;
    display: none;
    background-color: #000000;
    border: 1px dashed #ffff00;
  }
  
  .controls {
    background-color: #ffffff;
    padding: 15px 10px;
    border-top: 3px solid #2712e0;
  }
  
  input[type="text"] {
    width: 95%; padding: 10px; margin-bottom: 10px;
    border: 1px solid #2712e0; font-size: 14px; box-sizing: border-box;
  }
  input[type="submit"] {
    width: 100%; padding: 12px; font-weight: bold; font-size: 14px;
    border: none; border-radius: 4px; margin-bottom: 8px; cursor: pointer;
  }
  input[type="text"]:focus, input[type="submit"]:focus {
    background-color: #ffffcc; color: #000000; border: 2px solid #ff0000;
  }
  
  .btn-send { background-color: #0f1c73; color: white; border: 1px solid #0f1c73; }
  .btn-refresh { background-color: #59144a; color: white; border: 1px solid #59144a; }
  .btn-clear { background-color: #d90429; color: white; border: 1px solid #d90429; }
  
  .footer { background-color: #ffffff; text-align: center; font-size: 10px; color: #f50ac6; padding: 10px; }
</style>
</head>
<body>
  <div class="header">
    <h1>Xystelsya</h1>
    <p>Tasyacore Intelligence System</p>
  </div>

  <div id="status-text" class="status-text">Memuat...</div>

  <div id="chat-messages" class="chat-container">
    <div class="message assistant-message" id="first-msg">This is Xystelsya, 007 Agent, Ready to listen your secret.</div>
  </div>
  
  <div class="controls">
    <form onsubmit="return eksekusiKirim();" action="javascript:void(0);">
      <input type="text" id="user-input" placeholder="Ketik pertanyaan..." autocomplete="off">
      <input type="submit" value="1. Kirim Pesan" class="btn-send">
    </form>
    
    <br>
    
    <form action="?" method="GET">
      <input type="submit" value="2. Cek Balasan / Refresh Chat" class="btn-refresh">
    </form>
    
    <form onsubmit="return eksekusiHapus();" action="javascript:void(0);">
      <input type="submit" value="Hapus Semua Obrolan" class="btn-clear">
    </form>
  </div>

  <div class="footer">nS.aB Private Family Media</div>

  <script src="chat.js"></script>
</body>
</html>
