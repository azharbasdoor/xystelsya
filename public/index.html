<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Xystelsya AI</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.4;
        background-color: #e5e5e5;
        margin: 0;
        padding: 0;
      }

      .app-wrapper {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        min-height: 100vh;
        display: block;
        position: relative;
      }

      .header {
        text-align: center;
        padding: 12px 10px;
        border-bottom: 2px solid #2712e0;
        background-color: #ffffff;
      }

      .header h1 {
        font-size: 20px;
        color: #0f1c73;
        margin: 0 0 3px 0;
      }
      
      .header p {
        font-size: 11px;
        color: #6b7280;
        margin: 0;
      }

      .chat-container {
        padding: 12px;
        height: 280px; 
        overflow-y: auto;
        background-color: #3016db;
      }

      .clear {
        clear: both;
        line-height: 0;
        height: 0;
      }

      .message {
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        max-width: 75%;
        word-wrap: break-word;
        font-size: 14px;
      }

      .user-message {
        background-color: #e0129c;
        color: #ffffff;
        float: right;
        text-align: right;
      }

      .assistant-message {
        background-color: #10d2e8;
        color: #000000;
        float: left;
        text-align: left;
      }

      .typing-indicator {
        display: none;
        font-style: italic;
        color: #ffffff;
        font-size: 12px;
        text-align: center;
        padding: 5px;
        background-color: #3016db;
      }

      .message-input-form {
        padding: 10px;
        background-color: #ffffff;
        border-top: 1px solid #2712e0;
        text-align: center;
        margin: 0;
      }

      #user-input {
        width: 70%;
        padding: 10px 6px;
        border: 1px solid #2712e0;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
        vertical-align: middle;
      }

      #send-button {
        width: 25%;
        padding: 10px 0;
        margin-left: 2%;
        background-color: #0f1c73;
        color: white;
        border: 1px solid #0f1c73;
        border-radius: 4px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        vertical-align: middle;
      }

      /* Container untuk tombol Refresh dan Clear */
      .action-container {
        padding: 5px 10px 10px 10px;
        text-align: center;
        background-color: #ffffff;
        display: block;
      }

      .btn-action {
        display: inline-block;
        width: 45%;
        margin: 0 1%;
        padding: 10px 0;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 13px;
        border-radius: 4px;
        text-align: center;
        box-sizing: border-box;
      }

      .btn-refresh {
        background-color: #59144a;
        border: 1px solid #59144a;
      }

      .btn-clear {
        background-color: #d90429;
        border: 1px solid #d90429;
      }

      #user-input:focus, #send-button:focus, .btn-action:focus {
        background-color: #ffffcc;
        color: #000000;
        border: 2px solid #ff0000;
        outline: none;
      }

      .footer {
        text-align: center;
        font-size: 10px;
        color: #f50ac6;
        padding: 8px;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <div class="header">
        <h1>Xystelsya</h1>
        <p>Tasyacore Intelligence System</p>
      </div>

      <div id="chat-messages" class="chat-container">
        </div>

      <div class="typing-indicator" id="typing-indicator">
        Memproses balasan, mohon tunggu...
      </div>

      <form id="chat-form" action="#" onsubmit="return submitForm();" class="message-input-form">
        <input type="text" id="user-input" name="message" placeholder="Ketik pertanyaan..." autocomplete="off" />
        <input type="submit" id="send-button" value="Kirim" />
      </form>
      
      <div class="action-container">
        <a href="javascript:void(0);" onclick="window.location.reload();" class="btn-action btn-refresh">Refresh Chat</a>
        <a href="javascript:void(0);" onclick="clearChat();" class="btn-action btn-clear">Hapus Obrolan</a>
      </div>

      <div class="footer">
        nS.aB Private Family Media
      </div>
    </div>

    <script src="chat.js"></script>
  </body>
</html>
